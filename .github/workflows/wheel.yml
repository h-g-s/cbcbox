name: cibuildwheel

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish wheels to PyPI: (testpypi/pypi/none)'
        required: false
        type: choice
        options:
          - testpypi
          - pypi
          - none
        default: none
      windows_only:
        description: >-
          Run only the Windows jobs (compile + package + crash-repro), skipping
          Linux/macOS and publishing. Use this for fast iteration when debugging
          a Windows-specific issue (e.g. the generic-variant crash under gdb).
        required: false
        type: boolean
        default: false
          

jobs:

  # ── Linux ARM64 ──────────────────────────────────────────────────────────────

  compile-linux-arm64-generic:
    name: Compile Linux ARM64 generic
    if: github.event.inputs.windows_only != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build generic binary (manylinux2014_aarch64)
        run: |
          for i in 1 2 3; do
            docker pull quay.io/pypa/manylinux2014_aarch64 && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker run --rm \
            -v "$PWD:/project" \
            -e CBCBOX_BUILD_VARIANT=generic \
            -e CBCBOX_BUILD_ONLY=1 \
            quay.io/pypa/manylinux2014_aarch64 \
            bash -c 'export PATH=/opt/python/cp313-cp313/bin:$PATH &&
                     yum install -y gcc-gfortran &&
                     pip install setuptools wheel patchelf &&
                     cd /project &&
                     python setup.py build_ext'
          sudo chown -R "$USER:$USER" cbc_dist/ 2>/dev/null || true
          tar -czf cbc_dist_generic.tar.gz cbc_dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-linux-arm64-generic
          path: cbc_dist_generic.tar.gz

  compile-linux-arm64-debug:
    name: Compile Linux ARM64 debug+ASan
    if: github.event.inputs.windows_only != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build debug binary (manylinux_2_28_aarch64)
        run: |
          for i in 1 2 3; do
            docker pull quay.io/pypa/manylinux_2_28_aarch64 && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker run --rm \
            -v "$PWD:/project" \
            -e CBCBOX_BUILD_VARIANT=debug \
            -e CBCBOX_BUILD_ONLY=1 \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -c 'export PATH=/opt/python/cp313-cp313/bin:$PATH &&
                     yum install -y gcc-gfortran &&
                     pip install setuptools wheel patchelf &&
                     cd /project &&
                     python setup.py build_ext &&
                     bash scripts/build_mip_debug_cuts.sh cbc_dist_debug Cbc'
          sudo chown -R "$USER:$USER" cbc_dist_debug/ 2>/dev/null || true
          tar -czf cbc_dist_debug.tar.gz cbc_dist_debug/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-linux-arm64-debug
          path: cbc_dist_debug.tar.gz

  package-linux-arm64:
    name: Package Linux ARM64 wheel
    if: github.event.inputs.windows_only != 'true'
    needs: [compile-linux-arm64-generic, compile-linux-arm64-debug]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-linux-arm64-generic
          path: .
      - run: tar -xzf cbc_dist_generic.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-linux-arm64-debug
          path: .
      - run: tar -xzf cbc_dist_debug.tar.gz
      - name: Build and test wheel (compilation skipped — binaries pre-built)
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS: "aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "quay.io/pypa/manylinux2014_aarch64"
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y gcc-gfortran &&
            pip install patchelf
          CIBW_ENVIRONMENT_LINUX: "PERF_REPORT_DIR=/output"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: ""
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "mkdir -p /output && pytest {package}/tests/ -v"
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-Linux-ARM64
          path: ./wheelhouse/*.whl
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-linux-arm64
          path: |
            wheelhouse/perf_report.md
            wheelhouse/perf_report.json
      - name: Upload mip-debug-cuts diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mip-debug-cuts-reports-linux-arm64
          path: wheelhouse/mip_debug_cuts_reports/*.log
          if-no-files-found: ignore

  # ── macOS ARM64 ───────────────────────────────────────────────────────────────

  compile-macos-arm64-generic:
    name: Compile macOS ARM64 generic
    if: github.event.inputs.windows_only != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran if needed
        run: which gfortran || brew install gcc
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build generic binary
        env:
          CBCBOX_BUILD_VARIANT: generic
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - run: tar -czf cbc_dist_generic.tar.gz cbc_dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-macos-arm64-generic
          path: cbc_dist_generic.tar.gz

  compile-macos-arm64-debug:
    name: Compile macOS ARM64 debug+ASan
    if: github.event.inputs.windows_only != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran if needed
        run: which gfortran || brew install gcc
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build debug binary
        env:
          CBCBOX_BUILD_VARIANT: debug
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - name: Build mip-debug-cuts diagnostic tool
        run: bash scripts/build_mip_debug_cuts.sh cbc_dist_debug Cbc
      - run: tar -czf cbc_dist_debug.tar.gz cbc_dist_debug/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-macos-arm64-debug
          path: cbc_dist_debug.tar.gz

  package-macos-arm64:
    name: Package macOS ARM64 wheel
    if: github.event.inputs.windows_only != 'true'
    needs: [compile-macos-arm64-generic, compile-macos-arm64-debug]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-macos-arm64-generic
          path: .
      - run: tar -xzf cbc_dist_generic.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-macos-arm64-debug
          path: .
      - run: tar -xzf cbc_dist_debug.tar.gz
      - name: Build and test wheel (compilation skipped — binaries pre-built)
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: "arm64"
          CIBW_BEFORE_ALL_MACOS: >
            which gfortran || brew install gcc
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {package}/tests/ -v"
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-macOS-ARM64
          path: ./wheelhouse/*.whl
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-macos-arm64
          path: |
            tests/perf_report.md
            tests/perf_report.json
      - name: Upload mip-debug-cuts diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mip-debug-cuts-reports-macos-arm64
          path: tests/mip_debug_cuts_reports/*.log
          if-no-files-found: ignore

  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  # Both variants are compiled inside the manylinux2014 container so the
  # resulting binaries are ABI-compatible with any manylinux2014+ distro.
  # Using cp313 Python from the image ensures all setup.py features work.

  compile-linux-x64-generic:
    name: Compile Linux x86_64 generic
    if: github.event.inputs.windows_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build generic binary (manylinux2014)
        run: |
          for i in 1 2 3; do
            docker pull quay.io/pypa/manylinux2014_x86_64 && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker run --rm \
            -v "$PWD:/project" \
            -e CBCBOX_BUILD_VARIANT=generic \
            -e CBCBOX_BUILD_ONLY=1 \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c 'export PATH=/opt/python/cp313-cp313/bin:$PATH &&
                     yum install -y gcc-gfortran &&
                     pip install setuptools wheel patchelf &&
                     cd /project &&
                     python setup.py build_ext'
          sudo chown -R "$USER:$USER" cbc_dist/ 2>/dev/null || true
          tar -czf cbc_dist_generic.tar.gz cbc_dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-linux-x64-generic
          path: cbc_dist_generic.tar.gz

  compile-linux-x64-avx2:
    name: Compile Linux x86_64 AVX2
    if: github.event.inputs.windows_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AVX2 binary (manylinux2014)
        run: |
          for i in 1 2 3; do
            docker pull quay.io/pypa/manylinux2014_x86_64 && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker run --rm \
            -v "$PWD:/project" \
            -e CBCBOX_BUILD_VARIANT=avx2 \
            -e CBCBOX_BUILD_ONLY=1 \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c 'export PATH=/opt/python/cp313-cp313/bin:$PATH &&
                     yum install -y gcc-gfortran &&
                     pip install setuptools wheel patchelf &&
                     cd /project &&
                     python setup.py build_ext'
          sudo chown -R "$USER:$USER" cbc_dist_avx2/ 2>/dev/null || true
          tar -czf cbc_dist_avx2.tar.gz cbc_dist_avx2/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-linux-x64-avx2
          path: cbc_dist_avx2.tar.gz

  compile-linux-x64-debug:
    name: Compile Linux x86_64 debug+ASan+AVX2
    if: github.event.inputs.windows_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build debug AVX2 binary (manylinux_2_28_x86_64)
        run: |
          for i in 1 2 3; do
            docker pull quay.io/pypa/manylinux_2_28_x86_64 && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker run --rm \
            -v "$PWD:/project" \
            -e CBCBOX_BUILD_VARIANT=debug_avx2 \
            -e CBCBOX_BUILD_ONLY=1 \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -c 'export PATH=/opt/python/cp313-cp313/bin:$PATH &&
                     yum install -y gcc-gfortran &&
                     pip install setuptools wheel patchelf &&
                     cd /project &&
                     python setup.py build_ext &&
                     bash scripts/build_mip_debug_cuts.sh cbc_dist_debug_avx2 Cbc'
          sudo chown -R "$USER:$USER" cbc_dist_debug_avx2/ 2>/dev/null || true
          tar -czf cbc_dist_debug_avx2.tar.gz cbc_dist_debug_avx2/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-linux-x64-debug
          path: cbc_dist_debug_avx2.tar.gz

  package-linux-x64:
    name: Package Linux x86_64 wheel
    if: github.event.inputs.windows_only != 'true'
    needs: [compile-linux-x64-generic, compile-linux-x64-avx2, compile-linux-x64-debug]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-linux-x64-generic
          path: .
      - run: tar -xzf cbc_dist_generic.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-linux-x64-avx2
          path: .
      - run: tar -xzf cbc_dist_avx2.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-linux-x64-debug
          path: .
      - run: tar -xzf cbc_dist_debug_avx2.tar.gz
      - name: Build and test wheel (compilation skipped — binaries pre-built)
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux2014_x86_64"
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y gcc-gfortran &&
            pip install patchelf
          CIBW_ENVIRONMENT_LINUX: "PERF_REPORT_DIR=/output"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: ""
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "mkdir -p /output && pytest {package}/tests/ -v"
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-Linux-X64
          path: ./wheelhouse/*.whl
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-ubuntu-latest-x86_64
          path: |
            wheelhouse/perf_report.md
            wheelhouse/perf_report.json
      - name: Upload mip-debug-cuts diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mip-debug-cuts-reports-linux-x64
          path: wheelhouse/mip_debug_cuts_reports/*.log
          if-no-files-found: ignore

  # ── macOS Intel (x86_64) ─────────────────────────────────────────────────────

  compile-macos-intel-generic:
    name: Compile macOS Intel generic
    if: github.event.inputs.windows_only != 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran if needed
        run: which gfortran || brew install gcc
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build generic binary
        env:
          CBCBOX_BUILD_VARIANT: generic
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - run: tar -czf cbc_dist_generic.tar.gz cbc_dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-macos-intel-generic
          path: cbc_dist_generic.tar.gz

  compile-macos-intel-avx2:
    name: Compile macOS Intel AVX2
    if: github.event.inputs.windows_only != 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran if needed
        run: which gfortran || brew install gcc
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build AVX2 binary
        env:
          CBCBOX_BUILD_VARIANT: avx2
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - run: tar -czf cbc_dist_avx2.tar.gz cbc_dist_avx2/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-macos-intel-avx2
          path: cbc_dist_avx2.tar.gz

  compile-macos-intel-debug:
    name: Compile macOS Intel debug+ASan+AVX2
    if: github.event.inputs.windows_only != 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran if needed
        run: which gfortran || brew install gcc
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build debug AVX2 binary
        env:
          CBCBOX_BUILD_VARIANT: debug_avx2
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - name: Build mip-debug-cuts diagnostic tool
        run: bash scripts/build_mip_debug_cuts.sh cbc_dist_debug_avx2 Cbc
      - run: tar -czf cbc_dist_debug_avx2.tar.gz cbc_dist_debug_avx2/
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-macos-intel-debug
          path: cbc_dist_debug_avx2.tar.gz

  package-macos-intel:
    name: Package macOS Intel wheel
    if: github.event.inputs.windows_only != 'true'
    needs: [compile-macos-intel-generic, compile-macos-intel-avx2, compile-macos-intel-debug]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-macos-intel-generic
          path: .
      - run: tar -xzf cbc_dist_generic.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-macos-intel-avx2
          path: .
      - run: tar -xzf cbc_dist_avx2.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-macos-intel-debug
          path: .
      - run: tar -xzf cbc_dist_debug_avx2.tar.gz
      - name: Build and test wheel (compilation skipped — binaries pre-built)
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: "x86_64"
          CIBW_BEFORE_ALL_MACOS: >
            which gfortran || brew install gcc
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {package}/tests/ -v"
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-macOS-X64
          path: ./wheelhouse/*.whl
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-macos-15-intel-x86_64
          path: |
            tests/perf_report.md
            tests/perf_report.json
      - name: Upload mip-debug-cuts diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mip-debug-cuts-reports-macos-intel
          path: tests/mip_debug_cuts_reports/*.log
          if-no-files-found: ignore

  # ── Windows (AMD64) ───────────────────────────────────────────────────────────

  compile-windows-generic:
    name: Compile Windows generic
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 toolchain
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          pacman-key --init
          pacman-key --populate msys2
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-gcc-fortran \
            make \
            autoconf automake libtool pkg-config
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build generic binary
        env:
          CBCBOX_BUILD_VARIANT: generic
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - run: tar -czf cbc_dist_generic.tar.gz cbc_dist/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-windows-generic
          path: cbc_dist_generic.tar.gz

  compile-windows-avx2:
    name: Compile Windows AVX2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 toolchain
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          pacman-key --init
          pacman-key --populate msys2
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-gcc-fortran \
            make \
            autoconf automake libtool pkg-config
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build AVX2 binary
        env:
          CBCBOX_BUILD_VARIANT: avx2
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - run: tar -czf cbc_dist_avx2.tar.gz cbc_dist_avx2/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-windows-avx2
          path: cbc_dist_avx2.tar.gz

  compile-windows-debug:
    name: Compile Windows debug+AVX2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 toolchain
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          pacman-key --init
          pacman-key --populate msys2
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-gcc-fortran \
            make \
            autoconf automake libtool pkg-config
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build debug AVX2 binary (ASan not supported on MinGW)
        env:
          CBCBOX_BUILD_VARIANT: debug_avx2
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - name: Build mip-debug-cuts diagnostic tool
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash scripts/build_mip_debug_cuts.sh cbc_dist_debug_avx2 Cbc
      - run: tar -czf cbc_dist_debug_avx2.tar.gz cbc_dist_debug_avx2/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-windows-debug
          path: cbc_dist_debug_avx2.tar.gz

  compile-windows-release-symbols:
    name: Compile Windows release+symbols (exact release flags, -g added)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 toolchain
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          pacman-key --init
          pacman-key --populate msys2
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-gcc-fortran \
            mingw-w64-x86_64-gdb \
            make \
            autoconf automake libtool pkg-config
      - name: Install Python build deps
        run: pip install setuptools wheel
      - name: Build release binary with -g added (same CXXFLAGS/-DNDEBUG as shipped generic release)
        env:
          CBCBOX_BUILD_VARIANT: release_symbols
          CBCBOX_BUILD_ONLY: "1"
        run: python setup.py build_ext
      - run: tar -czf cbc_dist_release_symbols.tar.gz cbc_dist/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cbc-dist-windows-release-symbols
          path: cbc_dist_release_symbols.tar.gz

  windows-crash-repro:
    name: Windows generic-variant crash repro (gdb backtrace)
    needs: [compile-windows-release-symbols]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 toolchain
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          pacman-key --init
          pacman-key --populate msys2
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-gdb \
            make
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-windows-release-symbols
          path: .
      - run: tar -xzf cbc_dist_release_symbols.tar.gz
        shell: bash
      - name: Reproduce crashes under gdb and capture backtraces
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          CBC_BIN="cbc_dist/bin/cbc.exe"
          OUT_DIR="crash_repro_reports"
          mkdir -p "$OUT_DIR"
          # Instances that crashed with "Could not parse final objective from
          # CBC output" on the release generic Windows build in run 31271883740.
          INSTANCES="sprint_hidden06_j air03 nw04 nursesched-sprint02 pk1 mas76 eil33-2 fiber markshare_4_0 irp qap10"
          export OPENBLAS_NUM_THREADS=1
          SUMMARY="$OUT_DIR/SUMMARY.txt"
          : > "$SUMMARY"
          for inst in $INSTANCES; do
            f="tests/${inst}.mps.gz"
            log="$OUT_DIR/${inst}.gdb.log"
            echo "=== $inst ===" | tee -a "$SUMMARY"
            gdb -q --batch \
              -ex "set pagination off" \
              -ex "run" \
              -ex "bt full" \
              -ex "info registers" \
              -ex "thread apply all bt" \
              --args "$CBC_BIN" "$f" -seconds 120 -timem elapsed -solve -quit \
              > "$log" 2>&1 || true
            # Pull out the crash signal line and top frames for the summary.
            grep -E "^Program (received|terminated)|Assertion|^#[0-9]+ " "$log" | head -20 >> "$SUMMARY" || true
            echo "" >> "$SUMMARY"
          done
          echo "===== FULL SUMMARY ====="
          cat "$SUMMARY"
      - name: Upload crash repro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-repro-reports
          path: crash_repro_reports/*
          if-no-files-found: warn

  package-windows:
    name: Package Windows wheel
    needs: [compile-windows-generic, compile-windows-avx2, compile-windows-debug]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2 toolchain
        shell: C:\msys64\usr\bin\bash.exe -l {0}
        run: |
          pacman-key --init
          pacman-key --populate msys2
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-gcc-fortran \
            make \
            autoconf automake libtool pkg-config
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-windows-generic
          path: .
      - run: tar -xzf cbc_dist_generic.tar.gz
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-windows-avx2
          path: .
      - run: tar -xzf cbc_dist_avx2.tar.gz
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          name: cbc-dist-windows-debug
          path: .
      - run: tar -xzf cbc_dist_debug_avx2.tar.gz
        shell: bash
      - name: Build and test wheel (compilation skipped — binaries pre-built)
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: "AMD64"
          CIBW_BEFORE_ALL_WINDOWS: ""
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {package}/tests/ -v"
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-Windows-AMD64
          path: ./wheelhouse/*.whl
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-windows-latest-AMD64
          path: |
            tests/perf_report.md
            tests/perf_report.json
      - name: Upload mip-debug-cuts diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mip-debug-cuts-reports-windows
          path: tests/mip_debug_cuts_reports/*.log
          if-no-files-found: ignore

  # ── Combine performance reports ───────────────────────────────────────────────

  combine_reports:
    name: Combine performance reports
    if: always() && github.event.inputs.windows_only != 'true'
    needs:
      - package-linux-arm64
      - package-macos-arm64
      - package-linux-x64
      - package-macos-intel
      - package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all performance reports
        uses: actions/download-artifact@v4
        with:
          pattern: perf-report-*
          path: perf_reports/

      - name: Install plot dependencies
        run: pip install matplotlib numpy

      - name: Generate combined report and update README
        run: python3 .github/scripts/combine_perf_reports.py perf_reports perf_report_combined.md README.md

      - name: Generate AVX2 speedup plot and update README
        run: python3 .github/scripts/generate_perf_plots.py perf_reports docs/perf_avx2_speedup.png README.md

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-combined
          path: perf_report_combined.md

      - name: Commit and push README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          git diff --staged --quiet && echo "README unchanged" || \
            (git commit -m "docs: update performance results [skip ci]" && \
             git pull --rebase origin master && git push)

  # ── Publish ───────────────────────────────────────────────────────────────────

  publish-to-testpypi:
    name: Publish Python wheels to TestPyPI
    if: github.event.inputs.windows_only != 'true' && github.event.inputs.publish == 'testpypi'
    needs:
      - package-linux-arm64
      - package-macos-arm64
      - package-linux-x64
      - package-macos-intel
      - package-windows
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/cbcbox

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: cibw-wheels-*
        merge-multiple: true
        path: dist/
    - name: List all the dists
      run: ls -l dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish Python wheels to PyPI
    if: github.event.inputs.windows_only != 'true' && github.event.inputs.publish == 'pypi'
    needs:
      - package-linux-arm64
      - package-macos-arm64
      - package-linux-x64
      - package-macos-intel
      - package-windows
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/cbcbox

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: cibw-wheels-*
        merge-multiple: true
        path: dist/
    - name: List all the dists
      run: ls -l dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://upload.pypi.org/legacy/

